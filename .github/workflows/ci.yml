name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ==========================================================================
  # GATE 1 + 2 — the load-bearing gates. No toolchain, no cache, seconds.
  # These run first so a violation fails before anything expensive starts.
  # ==========================================================================
  language-purity:
    name: Gate 1+2 — one language
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Gate 1 — extension allowlist
        run: |
          set -euo pipefail
          # The ONLY extensions this repository may contain.
          allowed='rs|toml|md|lock|html|css|yml|json'
          # Files with no extension that are still legitimate.
          allowed_names='LICENSE|CODEOWNERS|.gitignore|.gitattributes'
          bad=0
          while IFS= read -r f; do
            base="${f##*/}"
            if printf '%s\n' "$base" | grep -Eq "^(${allowed_names})$"; then continue; fi
            case "$base" in
              *.*) ext="${base##*.}" ;;
              *)   ext="" ;;
            esac
            if ! printf '%s\n' "$ext" | grep -Eq "^(${allowed})$"; then
              printf 'FORBIDDEN FILE  %s  (extension %s)\n' "$f" "${ext:-<none>}"
              bad=1
            fi
          done < <(git ls-files)
          if [ "$bad" -ne 0 ]; then
            echo
            echo "This repository is Rust only. See CLAUDE.md section 2."
            echo "Allowed extensions: ${allowed//|/ }"
            exit 1
          fi
          echo "OK — every tracked file is in the allowlist."

      - name: Gate 1b — .json and .yml are confined
        run: |
          set -euo pipefail
          # JSON and YAML are config, not source, and only belong in two places.
          bad=$(git ls-files '*.json' '*.yml' \
                | grep -Ev '^(\.github/|crates/web/)' || true)
          if [ -n "$bad" ]; then
            printf 'CONFIG OUTSIDE ITS HOME:\n%s\n' "$bad"; exit 1
          fi
          echo "OK."

      - name: Gate 1c — no literal credential path
        run: |
          set -euo pipefail
          # This repository is public. A Parameter Store path names an account,
          # an environment and a vendor relationship; once pushed it lives in
          # every fork's history forever. Documents carry only the generic
          # shape /<org>/<env>/<vendor>/<field> — which does not match this
          # pattern, because <env> is not a real environment name.
          # See docs/05-decisions.md D-0013 and docs/04-invariants.md X-08.
          #
          # No untrusted input reaches this step: the inputs are `git ls-files`
          # and a static pattern. Nothing from the event payload is expanded.
          envs='prod|production|dev|development|stage|staging|uat|qa|sandbox|live'
          hits=$(git ls-files -z \
                 | xargs -0 -r grep -nE "/[A-Za-z0-9][A-Za-z0-9_.-]*/(${envs})/" \
                 || true)
          if [ -n "$hits" ]; then
            printf 'LITERAL CREDENTIAL PATH IN A TRACKED FILE:\n%s\n' "$hits"
            echo
            echo "Use the shape /<org>/<env>/<vendor>/<field>. The real"
            echo "segments are resolved at runtime. See D-0013."
            exit 1
          fi
          # The runtime configuration itself is never tracked.
          tracked=$(git ls-files | grep -E '(^|/)credentials\.toml$' || true)
          if [ -n "$tracked" ]; then
            printf 'CREDENTIAL CONFIG IS TRACKED:\n%s\n' "$tracked"; exit 1
          fi
          echo "OK — no literal credential path, no tracked credential config."

      - name: Gate 2 — no build script shells out
        run: |
          set -euo pipefail
          hits=$(git ls-files '*build.rs' | xargs -r grep -ln \
                 -e 'Command::new' -e 'std::process' || true)
          if [ -n "$hits" ]; then
            printf 'BUILD SCRIPT INVOKES AN EXTERNAL PROCESS:\n%s\n' "$hits"
            echo "A build script is Rust, so gate 1 passes it — and then it runs"
            echo "something else. That is the side door. See CLAUDE.md section 2."
            exit 1
          fi
          echo "OK — no build script invokes an external process."

      - name: Gate 9 — core depends on nothing
        run: |
          set -euo pipefail
          # docs/01-architecture.md gives core "May depend on: nothing". Gate 7
          # guards crates/web, but web's single allowed dependency IS core --
          # so a dependency added to core is silently forced into a wasm32
          # build where the filesystem does not exist. Without this gate the
          # architecture's most load-bearing arrow is a convention.
          f=crates/core/Cargo.toml
          [ -f "$f" ] || { echo "skip — crate not created yet"; exit 0; }
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          if [ -n "$deps" ]; then
            printf 'crates/core MUST DEPEND ON NOTHING. Found:\n%s\n' "$deps"
            echo "core is compiled to wasm32 through crates/web. See D-0009."
            exit 1
          fi
          echo "OK — core depends on nothing."

      - name: Gate 9b — greeks depends on nothing
        run: |
          set -euo pipefail
          # Same shape as gate 9, for the same reason and a different consumer.
          # crates/greeks is taken by the `tickvault` repository by git URL, so
          # a dependency added here is a dependency forced on a repository that
          # is not this one -- and a type from this workspace in its public
          # surface makes it unusable there outright.
          #
          # Until this gate existed the property was advertised in six places
          # and enforced in none. `crates/greeks/tests/standalone.rs` was named
          # as the proof and cannot be: an integration test fails only on items
          # it NAMES, so a leaked type it does not name is invisible to it, and
          # a `pub use` adds zero code regions so the coverage gate cannot see
          # one either. Both were verified by breaking the property in a copy
          # of this workspace outside the repository -- clippy, the full test
          # suite and 100% coverage all stayed green. See D-0037.
          #
          # No untrusted input reaches this step: the inputs are a tracked
          # manifest path, `git ls-files` and static patterns. Nothing from the
          # event payload is expanded.
          f=crates/greeks/Cargo.toml
          [ -f "$f" ] || { echo "skip — crate not created yet"; exit 0; }
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          if [ -n "$deps" ]; then
            printf 'crates/greeks MUST DEPEND ON NOTHING. Found:\n%s\n' "$deps"
            echo "It is shared with another repository by git URL. See D-0037."
            exit 1
          fi
          # And no dev-dependency either: a dev-dependency is not forced on a
          # consumer, but it is forced on anyone who runs this crate's tests,
          # and this crate's tests are part of what is shared.
          dev=$(awk '/^\[dev-dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          if [ -n "$dev" ]; then
            printf 'crates/greeks MUST DECLARE NO DEV-DEPENDENCY. Found:\n%s\n' "$dev"
            exit 1
          fi
          # The public surface names no type from this workspace. Every other
          # crate here is reachable only by its package name, so naming one at
          # all is the leak -- including through a re-export, which is the case
          # standalone.rs cannot see.
          leaks=$(git ls-files 'crates/greeks/**/*.rs' \
                  | xargs -r grep -nE '\b(brutex_core|core::(price|instrument|universe|vendor))\b' \
                  || true)
          if [ -n "$leaks" ]; then
            printf 'A WORKSPACE TYPE APPEARS IN crates/greeks:\n%s\n' "$leaks"
            exit 1
          fi
          echo "OK — greeks depends on nothing and names no workspace type."

      - name: Gate 10 — every invariant names a test that exists
        run: |
          set -euo pipefail
          # docs/04-invariants.md asserts: "A consistency check in CI fails if
          # a row's test does not exist." Until this gate existed that sentence
          # was false, which is precisely the decay the file was written to
          # prevent -- a row pointing at nothing is what turns the file into a
          # wish list.
          #
          # A row is checked when its "Proven by" cell names a Rust test in
          # `crate::module::test_name` form AND its status is not "—" (not yet
          # reachable, because the crate does not exist). Rows proven by a CI
          # gate or a const assertion are not Rust tests and are skipped.
          f=docs/04-invariants.md
          missing=0; checked=0
          while IFS= read -r line; do
            case "$line" in \|*) ;; *) continue ;; esac
            # Status is the last non-empty cell on the row.
            st=$(printf '%s\n' "$line" | awk -F'|' '{print $(NF-1)}' | tr -d ' ')
            [ "$st" = "—" ] && continue
            # Pull every `crate::module::name` token out of the row.
            for t in $(printf '%s\n' "$line" \
                       | grep -oE '`[a-z_]+::[a-z_]+::[a-z_0-9]+`' \
                       | tr -d '`' || true); do
              fn="${t##*::}"
              checked=$((checked + 1))
              if ! git ls-files '*.rs' | xargs -r grep -qE "fn ${fn}\b"; then
                echo "INVARIANT POINTS AT A TEST THAT DOES NOT EXIST: ${t}"
                missing=$((missing + 1))
              fi
            done
          done < "$f"
          echo "checked ${checked} named test(s); ${missing} missing"
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Either write the test, or record abandoning the invariant in"
            echo "docs/05-decisions.md. Rows are never deleted to go green."
            exit 1
          fi
          echo "OK — every reachable invariant names a test that exists."

      - name: Gate 7 — the browser crate depends on core alone
        run: |
          set -euo pipefail
          f=crates/web/Cargo.toml
          [ -f "$f" ] || { echo "skip — crate not created yet"; exit 0; }
          deps=$(awk '/^\[dependencies\]/{f=1;next} /^\[/{f=0} f && /=/ {print $1}' "$f" \
                 | grep -v '^$' || true)
          extra=$(printf '%s\n' "$deps" | grep -v '^core$' || true)
          if [ -n "$extra" ]; then
            printf 'crates/web MAY ONLY DEPEND ON core. Found:\n%s\n' "$extra"
            echo "It compiles to wasm32 where the filesystem does not exist."
            exit 1
          fi
          echo "OK."

  # ==========================================================================
  # GATES 3-6 — the toolchain gates.
  # ==========================================================================
  build:
    name: Gates 3-6 — fmt, clippy, deny, test
    runs-on: ubuntu-24.04
    needs: language-purity
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Cargo refuses a virtual workspace with no members, so between the
      # automation commit and the first crate there is genuinely nothing to
      # compile. This probe says so out loud rather than letting a green tick
      # imply a build happened. It disarms itself permanently the moment
      # crates/core lands, and it is checked against the tracked tree, not the
      # manifest, so it cannot be satisfied by an untracked directory.
      - name: Is there a crate to build yet?
        id: probe
        run: |
          set -euo pipefail
          n=$(git ls-files 'crates/*/Cargo.toml' | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "has_crates=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No crate exists yet::\
          The toolchain gates (fmt, build, clippy, deny, test) compiled NOTHING \
          on this commit because the workspace has no members. This is not a \
          passing build — it is an empty one. It stops being possible as soon \
          as crates/core is merged."
          else
            echo "has_crates=true" >> "$GITHUB_OUTPUT"
            echo "$n crate manifest(s) tracked — the toolchain gates apply."
          fi

      - name: Gate 6a — formatting
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo fmt --all --check

      # `--offline` only succeeds if every crate is already in CARGO_HOME.
      # A newly added dependency has never been downloaded on a runner, so
      # gate 4 structurally rejected the FIRST dependency the workspace ever
      # gained -- it passed until now only because there were none. Fetching
      # with --locked first preserves the whole point of the gate (build the
      # EXACT locked versions, resolve nothing) while letting it actually run.
      - name: Gate 4a — fetch exactly what the lock names
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo fetch --locked

      - name: Gate 4 — locked, offline
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo build --workspace --locked --offline --all-targets

      - name: Gate 6b — clippy
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Gate 5 — unsafe is denied, exceptions are counted
        run: |
          set -euo pipefail
          # unsafe_code = "deny" at the workspace root already fails the build.
          # This gate additionally caps how many documented exceptions exist,
          # so they cannot quietly multiply.
          # Two bugs lived here and both failed in the SAFE direction's
          # opposite: `grep -c` exits 1 when it matches nothing, and with
          # `set -o pipefail` that made the gate fail exactly when the
          # repository was clean. And `grep -c` omits the `file:` prefix when
          # given a single file, so `awk -F:` read field 2 of a bare number
          # and counted zero — an exception in the only .rs file would have
          # been invisible. Counting occurrences directly fixes both.
          n=$( { git ls-files '*.rs' | xargs -r grep -oh 'allow(unsafe_code)' || true; } \
               | wc -l | tr -d ' ')
          echo "documented unsafe exceptions: $n"
          if [ "$n" -gt 3 ]; then
            echo "More than 3 unsafe exceptions. Each needs a decision entry."
            git ls-files '*.rs' | xargs -r grep -n 'allow(unsafe_code)'
            exit 1
          fi

      - name: Gate 3 — dependency policy
        if: steps.probe.outputs.has_crates == 'true'
        run: |
          set -euo pipefail
          # The pin was ^0.16, which cannot PARSE the current RUSTSEC advisory
          # database: RUSTSEC-2026-0109.md uses TOML front-matter that 0.16.4
          # rejects, so the gate died on "failed to load advisory database"
          # before it checked anything. That is the worst shape of failure for
          # a security gate -- red for a reason unrelated to security, which
          # trains a reader to ignore it.
          #
          # This is a CI tool version, not a workspace dependency: it adds
          # nothing to the dependency graph and needs no ledger entry. The
          # constraint stays bounded rather than floating, so a future breaking
          # 0.18.9 needs rustc 1.88 and rust-toolchain.toml pins 1.85.0, so the
          # version is pinned EXACTLY at 0.18.3 -- the newest release cargo
          # itself reports as supporting 1.85.0. A caret range would silently
          # re-break the moment a newer cargo-deny raises its MSRV again.
          #
          # THE VERSION IS PINNED, AND UNTIL D-0034 IT WAS NOT. The paragraph
          # above said "pinned EXACTLY at 0.18.3" while the command below said
          # `cargo install cargo-deny --locked` -- and `--locked` pins the
          # tool's own dependency graph, never the tool version. So every run
          # installed whatever was newest that day, and a security gate whose
          # verdict can change with no commit is a verdict nobody can read.
          # 0.19.0 is the version this repository is measured against; the
          # advisory database is still fetched fresh on every run, which is the
          # part that is supposed to move.
          cargo install cargo-deny --version 0.19.0 --locked
          cargo deny check

      - name: Tests
        if: steps.probe.outputs.has_crates == 'true'
        run: cargo test --workspace --locked

      - name: The browser crate actually builds for the browser
        run: |
          [ -d crates/web ] || { echo "skip"; exit 0; }
          cargo build -p web --target wasm32-unknown-unknown --locked

  # ==========================================================================
  # Coverage — 100% line and branch, no omit list.
  # ==========================================================================
  coverage:
    name: Coverage 100%
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
      - name: Measure
        run: |
          set -euo pipefail
          n=$(git ls-files 'crates/*/Cargo.toml' | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "::warning title=Coverage measured nothing::\
          No crate exists yet, so 100% coverage is vacuously true. \
          See docs/06-limits.md section 7."
            exit 0
          fi
          # THE MEASURING INSTRUMENT IS PINNED. `--locked` pins the tool's own
          # dependency graph, not the tool version, so this used to install
          # whatever cargo-llvm-cov was newest that day. `--fail-under-regions
          # 100` is the threshold most sensitive to how a given cargo-llvm-cov
          # and LLVM pair enumerates regions: a version that splits one region
          # into two turns the gate red with no source change, and one that
          # starts skipping a construct turns it green while uncovered code
          # exists. Neither is distinguishable from a real regression in the
          # log. 0.8.4 is the version the operator's machine measures with, so
          # "CI is green" and "my machine is green" are now the same statement.
          # D-0034.
          cargo install cargo-llvm-cov --version 0.8.4 --locked
          cargo llvm-cov --workspace --locked \
            --fail-under-lines 100 --fail-under-regions 100 \
            --summary-only

  # ==========================================================================
  # GATE 8 — per-operation cost stays constant as input grows.
  # ==========================================================================
  complexity:
    name: Gate 8 — O(1) ratio
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Per-operation cost at 1x / 10x / 100x
        run: |
          set -euo pipefail
          # THIS GATE WAS A NO-OP FOR THE WHOLE LIFE OF THE REPOSITORY, and
          # both defects fixed in D-0032 and D-0033 merged through it green.
          # The guard was `[ -d benches ] || { echo skip; exit 0; }`, which
          # tests for a directory at the repository ROOT. Cargo benches live at
          # `crates/<name>/benches`, so the probe could never have found one
          # even after they were written, and a skip that reports success is
          # exactly the fallback CLAUDE.md section 4 bans.
          #
          # It now looks where benches live, and an empty set is a FAILURE
          # rather than a pass: CLAUDE.md section 3 rule 4 makes this gate the
          # enforcement mechanism for constant per-operation cost, and a gate
          # cannot enforce over nothing. See D-0034.
          n=$(git ls-files 'crates/*/benches/*.rs' | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "GATE 8 MEASURED NOTHING — no crate carries a bench."
            echo "Write one, or record abandoning the invariant in"
            echo "docs/05-decisions.md. This step does not skip."
            exit 1
          fi
          echo "$n bench source file(s) tracked."
          # Each harness is `harness = false`: it prints every number it took
          # and exits non-zero on a breach. See docs/04-invariants.md C-01,
          # C-07 through C-10 for the ratios and the ceiling.
          cargo bench --workspace --locked

  # ==========================================================================
  # Aggregate — this is the only required check on the branch rule.
  # ==========================================================================
  # The job NAME is what a branch-protection rule and the auto-merge workflow
  # match on, so it is spelled exactly as the required check: `ci-ok`.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    needs: [language-purity, build, coverage, complexity]
    if: always()
    steps:
      - name: Verify every gate went green
        # The results cross into the shell through env rather than being
        # interpolated into the script body — the same rule the auto-merge
        # workflow follows, applied here for consistency even though `needs`
        # results are not attacker-controlled.
        #
        # Note the SINGLE quotes inside the expression. A GitHub Actions
        # expression accepts only single-quoted strings; `join(x, " ")` is a
        # parse error that invalidates the ENTIRE workflow file, which is how
        # this repository's first CI run produced zero jobs and no log.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: ${RESULTS}"
          if [ -z "${RESULTS}" ]; then
            echo "no gate reported a result at all — refusing to call that green"
            exit 1
          fi
          for x in ${RESULTS}; do
            [ "$x" = "success" ] || { echo "a gate did not pass: $x"; exit 1; }
          done
          echo "all gates green"
