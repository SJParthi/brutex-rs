[package]
name         = "core"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
description  = "Types, errors, the frozen condition table, and the trading calendar. Depends on nothing."

# ---------------------------------------------------------------------------
# THIS SECTION IS DELIBERATELY EMPTY AND STAYS EMPTY.
#
# docs/01-architecture.md: core "May depend on: nothing". Every rule that both
# the server and the browser must agree on lives here and is compiled twice --
# once native, once to wasm32 -- so the two cannot drift. A dependency added
# here is a dependency forced on crates/web, which compiles to WebAssembly
# where the filesystem does not exist.
#
# Adding a line below requires an entry in docs/05-decisions.md naming what it
# replaces, and it will make CI gate 7 fail for crates/web.
# ---------------------------------------------------------------------------
[dependencies]

[lints]
workspace = true

[lib]
# The PACKAGE is `core` — docs/01-architecture.md names it that, and gates 7
# and 9 match on the dependency key `core`. But the LIB TARGET cannot be
# `core`: it lands in the extern prelude and shadows the sysroot crate.
# Rustdoc's own generated doc-test harness references `core::result` and
# `core::fmt`, so a crate named `core` breaks rustdoc itself. Proven, not
# assumed: doc-tests failed with "cannot find `result` in `core`".
name = "brutex_core"

# ---------------------------------------------------------------------------
# GATE 8 — the O(1) ratio harness. `harness = false` so it is a plain binary
# with no benchmarking framework and therefore no dependency; `test = false`
# because `cargo test` must not run a timing loop, and the coverage gate must
# not measure one. See D-0034 and crates/core/benches/ratio.rs.
# ---------------------------------------------------------------------------
[[bench]]
name    = "ratio"
harness = false
test    = false
